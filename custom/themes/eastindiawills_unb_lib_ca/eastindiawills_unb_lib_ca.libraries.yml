# Adobe Fonts (Typekit) kit with the concept design's licensed faces:
# Caesura (bold) and Freight Sans Pro (book, medium, semibold + italics).
# Loaded as an external stylesheet, like nbbib's kit link in its
# html.html.twig. Family names are set in _variables_bootstrap.scss.
typekit:
  css:
    base:
      https://use.typekit.net/uzm7edc.css: { type: external }

global-styling:
  css:
    theme:
      dist/css/style.css:  { minified: true }
  js:
    # Bundled Bootstrap JS (includes Popper), required for navbar collapse,
    # dropdowns, etc. The base theme (drupal/bootstrap) does not provide this
    # itself; subthemes are expected to supply their own compiled Bootstrap
    # JS. Copied from vendor/twbs/bootstrap/dist/js/bootstrap.bundle.min.js.
    dist/js/bootstrap.bundle.min.js: { minified: true, weight: -10 }

# "Cite this record" box on will pages: fills in the access date and adds a
# Copy button. Attached by node--eiw-will--full.html.twig.
citation:
  js:
    dist/js/eiw-citation.js: {}
  dependencies:
    - core/drupal
    - core/once

# "Voyages and Ships" page: mirrors a hovered row's highlight across both
# columns. Attached by eiw-voyages-ships.html.twig.
voyages-ships:
  js:
    dist/js/eiw-voyages-ships.js: {}
  dependencies:
    - core/drupal
    - core/once
