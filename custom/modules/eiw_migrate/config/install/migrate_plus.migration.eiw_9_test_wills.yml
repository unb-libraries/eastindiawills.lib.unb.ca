# Test wills, for checking the will page with every field filled in:
# summary, a transcription of two or three paragraphs (placeholder text),
# health notes, voyages, the original document, keywords, and so on.
#
# Not part of the data import: run it by itself, and roll it back to remove
# the test wills:
#   drush mim eiw_9_test_wills
#   drush mr eiw_9_test_wills
#
# Voyages, ships and roles are looked up by name among existing records
# (src/Event/TestWillsBuilder.php), so import the voyages first; one that
# isn't found is left out. Keywords are created if they don't exist.
id: eiw_9_test_wills
label: Test wills with complete data

migration_tags:
  - Test

