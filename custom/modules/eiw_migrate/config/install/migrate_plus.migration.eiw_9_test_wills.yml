process:
  # The title is set from the name and probate date on save
  # (eiw_core_node_presave()); this just fills the required field.
  title: last_name
  status:
    plugin: default_value
    default_value: 1
  field_tropy_title: id
  field_first_name: first_name
  field_last_name: last_name
  field_additional_names: additional_names
  field_date_of_will: date_of_will
  field_date_of_probate: date_of_probate
  field_year_only_will: year_only_will
  field_year_only_probate: year_only_probate
  field_shipboard_will: shipboard
  field_reference: reference
  field_court:
    plugin: entity_lookup
    source: court
    entity_type: taxonomy_term
    bundle_key: vid
    bundle: eiw_courts
    value_key: name
  field_marital_status:
    plugin: entity_lookup
    source: marital_status
    entity_type: taxonomy_term
    bundle_key: vid
    bundle: eiw_marital_statuses
    value_key: name
  field_source_type:
    plugin: entity_lookup
    source: source_type
    entity_type: taxonomy_term
    bundle_key: vid
    bundle: eiw_source_types
    value_key: name
  field_keywords:
    - plugin: explode
      source: keywords
      delimiter: ', '
    - plugin: entity_generate
      entity_type: taxonomy_term
      bundle_key: vid
      bundle: eiw_keywords
      value_key: name
  field_summary/value: summary
  field_summary/format: constants/format
  field_transcription/value: transcription
  field_transcription/format: constants/format
  field_health_notes/value: health_notes
  field_health_notes/format: constants/format
  field_notes: constants/notes
  # Created by TestWillsBuilder.
  field_will_voyages: will_voyage_refs
  field_document_images: document_ref

destination:
  plugin: entity:node
  default_bundle: eiw_will

migration_dependencies: {}

dependencies:
  module:
    - eiw_migrate
  enforced:
    module:
      - eiw_migrate
