id: eiw_5_ship_types
label: East India Wills ship types (17th-century ship research)

migration_tags:
  - Voyages
  - CSV

# Generated by script/build_ship_csv.py: one eiw_ship_types term per kind of
# vessel, with the representative picture (from eiw_5_ship_images) shown for
# ships of that type that have no picture of their own.
# Existing terms are matched by name (case-insensitive) and left as editors
# made them, so a re-import never replaces a picture or caption changed on
# the site. All types are imported, whatever eiw_migrate.settings
# voyage_years is.
source:
  plugin: csv
  path: '/app/html/modules/custom/eiw_migrate/data/csv/eiw_ship_types.csv'
  header_offset: 0
  ids: [type_id]

process:
  tid:
    plugin: entity_lookup
    source: name
    entity_type: taxonomy_term
    bundle_key: vid
    bundle: eiw_ship_types
    value_key: name
    ignore_case: true
    access_check: false
  vid:
    plugin: default_value
    default_value: eiw_ship_types
  name: name
  weight: weight
  field_image/target_id:
    - plugin: skip_on_empty
      method: process
      source: image_id
    - plugin: migration_lookup
      migration: eiw_5_ship_images
      no_stub: true
  field_image/alt: image_alt
  field_image_caption/value: image_caption
  field_image_caption/format:
    plugin: default_value
    default_value: unb_libraries

destination:
  plugin: entity:taxonomy_term
  default_bundle: eiw_ship_types
  # Nothing is overwritten on terms that already exist (see above).
  overwrite_properties: []

migration_dependencies:
  optional:
    - eiw_5_ship_images

dependencies:
  module:
    - eiw_migrate
  enforced:
    module:
      - eiw_migrate
