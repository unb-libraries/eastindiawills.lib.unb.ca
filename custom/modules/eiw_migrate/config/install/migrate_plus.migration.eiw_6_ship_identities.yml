id: eiw_6_ship_identities
label: East India Wills identified ships (17th-century ship research)

migration_tags:
  - Voyages
  - CSV

# Generated by script/build_ship_csv.py: one eiw_ship_identity paragraph per
# physical ship. eiw_7_ships attaches them to the ship node of each name the
# ship sailed under. Only ships in service during eiw_migrate.settings
# voyage_years (or with a voyage departing then) are imported
# (VoyageYearFilter); the CSV covers the whole research period.
source:
  plugin: csv
  path: '/app/html/modules/custom/eiw_migrate/data/csv/eiw_ship_identities.csv'
  header_offset: 0
  ids: [ship_key]

process:
  type:
    plugin: default_value
    default_value: eiw_ship_identity
  field_identity_label: label
  field_former_names: former_names
  field_later_names: later_names
  field_ship_type: ship_type
  field_burthen: burthen_tons
  field_burthen_note: burthen_note
  field_acquired: acquired
  field_builder: builder_yard
  field_year_built: year_built
  field_year_acquired: year_acquired
  field_guns: guns
  field_men: men
  field_service_from: service_from
  field_service_to: service_to
  field_fate: fate
  field_fate_place: fate_place
  field_fate_year: fate_year
  field_voyages:
    - plugin: skip_on_empty
      method: process
      source: voyage_ids
    - plugin: explode
      delimiter: '|'
    - plugin: migration_lookup
      migration: eiw_4_voyages
      no_stub: true
  field_image/target_id:
    - plugin: skip_on_empty
      method: process
      source: image_id
    - plugin: migration_lookup
      migration: eiw_5_ship_images
      no_stub: true
  field_image/alt: image_alt
  field_image_caption/value: image_caption
  field_image_caption/format:
    plugin: default_value
    default_value: unb_libraries
  field_image_representative: image_representative
  field_sources/value: sources
  field_sources/format:
    plugin: default_value
    default_value: unb_libraries
  field_notes: notes

destination:
  plugin: entity:paragraph
  default_bundle: eiw_ship_identity

# Optional, not required: VoyageYearFilter skips out-of-range rows without
# recording them, so a required dependency would never count as complete.
migration_dependencies:
  optional:
    - eiw_4_voyages
    - eiw_5_ship_images

dependencies:
  module:
    - eiw_migrate
  enforced:
    module:
      - eiw_migrate
