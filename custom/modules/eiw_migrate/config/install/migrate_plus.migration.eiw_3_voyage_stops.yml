id: eiw_3_voyage_stops
label: East India Wills voyage stops (17th-century voyage research)

migration_tags:
  - Voyages
  - CSV

# Generated by script/build_voyage_csv.py: one eiw_voyage_stop paragraph per
# port call. eiw_4_voyages attaches them to their voyage in itinerary order.
# Only stops of voyages departing in eiw_migrate.settings voyage_years are
# imported (VoyageYearFilter); the CSV covers the whole research period.
source:
  plugin: csv
  path: '/app/html/modules/custom/eiw_migrate/data/csv/eiw_voyage_stops.csv'
  header_offset: 0
  ids: [stop_id]

process:
  type:
    plugin: default_value
    default_value: eiw_voyage_stop
  field_port:
    plugin: migration_lookup
    migration: eiw_2_ports
    source: port_id
    no_stub: true
  field_arrival_date: arrival
  field_departure_date: departure
  field_homeward: homeward
  field_notes: notes

destination:
  plugin: entity:paragraph
  default_bundle: eiw_voyage_stop

# Optional, not required: VoyageYearFilter skips out-of-range rows without
# recording them, so the dependency never counts as fully imported and a
# required dependency would block this migration. Ordering is unaffected.
migration_dependencies:
  optional:
    - eiw_2_ports

dependencies:
  module:
    - eiw_migrate
  enforced:
    module:
      - eiw_migrate
