id: eiw_4_voyages
label: East India Wills voyages (17th-century voyage research)

migration_tags:
  - Voyages
  - CSV

# Generated by script/build_voyage_csv.py: one eiw_voyage node per fleet
# voyage, 1600-1700. Imported unpublished for editorial review.
source:
  plugin: csv
  path: '/app/html/modules/custom/eiw_migrate/data/csv/eiw_voyages.csv'
  header_offset: 0
  ids: [voyage_id]

process:
  # Existing voyages are matched by title, so re-running the import updates
  # them in place (same node ID and URL) even after eiw_migrate has been
  # uninstalled and its ID map lost. Replaced stop paragraphs are deleted by
  # VoyageStopCleanup.
  nid:
    plugin: entity_lookup
    source: title
    entity_type: node
    bundle_key: type
    bundle: eiw_voyage
    value_key: title
    # Unpublished content must match too (drush runs as anonymous).
    access_check: false
  type:
    plugin: default_value
    default_value: eiw_voyage
  title:
    plugin: callback
    callable: trim
    source: title
  status:
    plugin: default_value
    default_value: 0
  field_description/value: description
  field_description/format:
    plugin: default_value
    default_value: unb_libraries
  field_notes: notes
  field_voyage_stops:
    - plugin: skip_on_empty
      method: process
      source: stop_ids
    - plugin: explode
      delimiter: '|'
    - plugin: migration_lookup
      migration: eiw_3_voyage_stops
      no_stub: true

destination:
  plugin: entity:node
  default_bundle: eiw_voyage
  # On voyages that already exist, only the imported content is replaced; the
  # title and publishing status stay as editors left them.
  overwrite_properties:
    - field_description
    - field_notes
    - field_voyage_stops

migration_dependencies:
  required:
    - eiw_3_voyage_stops

dependencies:
  module:
    - eiw_migrate
  enforced:
    module:
      - eiw_migrate
