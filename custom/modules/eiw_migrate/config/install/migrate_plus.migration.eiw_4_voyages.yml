id: eiw_4_voyages
label: East India Wills voyages (17th-century voyage research)

migration_tags:
  - Voyages
  - CSV

# Generated by script/build_voyage_csv.py: one eiw_voyage node per fleet
# voyage, 1600-1700. Imported unpublished for editorial review.
source:
  plugin: csv
  path: '/app/html/modules/custom/eiw_migrate/data/csv/eiw_voyages.csv'
  header_offset: 0
  ids: [voyage_id]

process:
  type:
    plugin: default_value
    default_value: eiw_voyage
  title:
    plugin: callback
    callable: trim
    source: title
  status:
    plugin: default_value
    default_value: 0
  field_description/value: description
  field_description/format:
    plugin: default_value
    default_value: unb_libraries
  field_notes: notes
  field_voyage_stops:
    - plugin: skip_on_empty
      method: process
      source: stop_ids
    - plugin: explode
      delimiter: '|'
    - plugin: migration_lookup
      migration: eiw_3_voyage_stops
      no_stub: true

destination:
  plugin: entity:node
  default_bundle: eiw_voyage

migration_dependencies:
  required:
    - eiw_3_voyage_stops

dependencies:
  module:
    - eiw_migrate
  enforced:
    module:
      - eiw_migrate
