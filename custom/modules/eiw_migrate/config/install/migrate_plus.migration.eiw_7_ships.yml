id: eiw_7_ships
label: East India Wills ships (17th-century ship research)

migration_tags:
  - Voyages
  - CSV

# Generated by script/build_ship_csv.py: one row per ship name in the wills
# list, with the physical ships that sailed under it (eiw_6_ship_identities).
# Ship nodes are matched by title, so the existing ones (which wills link to)
# are updated in place: only their identified ships are replaced, and
# rollback leaves the nodes themselves alone. A name with no ship in
# eiw_migrate.settings voyage_years keeps its node with no identified ships.
# Names with no ship node (not in the wills list) are skipped, not created.
source:
  plugin: csv
  path: '/app/html/modules/custom/eiw_migrate/data/csv/eiw_ships.csv'
  header_offset: 0
  ids: [name]

process:
  nid:
    - plugin: entity_lookup
      source: name
      entity_type: node
      bundle_key: type
      bundle: eiw_ship
      value_key: title
      # Unpublished content must match too (drush runs as anonymous).
      access_check: false
    - plugin: skip_on_empty
      method: row
      message: 'No ship node with this name'
  type:
    plugin: default_value
    default_value: eiw_ship
  field_ship_identities:
    - plugin: skip_on_empty
      method: process
      source: ship_keys
    - plugin: explode
      delimiter: '|'
    - plugin: migration_lookup
      migration: eiw_6_ship_identities
      no_stub: true

destination:
  plugin: entity:node
  default_bundle: eiw_ship
  overwrite_properties:
    - field_ship_identities

migration_dependencies:
  optional:
    - eiw_6_ship_identities

dependencies:
  module:
    - eiw_migrate
  enforced:
    module:
      - eiw_migrate
