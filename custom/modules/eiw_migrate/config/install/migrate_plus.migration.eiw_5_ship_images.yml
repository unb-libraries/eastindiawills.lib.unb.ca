id: eiw_5_ship_images
label: East India Wills ship images (17th-century ship research)

migration_tags:
  - Voyages
  - CSV

# Generated by script/build_ship_csv.py: one file per ship picture, whether a
# picture of a particular ship or a representative picture of a ship type.
# The image files are in data/images and are copied to public://ship_images.
# Only images used by a ship in service during eiw_migrate.settings
# voyage_years are imported (VoyageYearFilter).
source:
  plugin: csv
  path: '/app/html/modules/custom/eiw_migrate/data/csv/eiw_ship_images.csv'
  header_offset: 0
  ids: [image_id]
  constants:
    source_dir: '/app/html/modules/custom/eiw_migrate/data/images/'
    destination_dir: 'public://ship_images/'

process:
  source_path:
    plugin: concat
    source: [constants/source_dir, file]
  destination_path:
    plugin: concat
    source: [constants/destination_dir, file]
  uri:
    plugin: file_copy
    source: ['@source_path', '@destination_path']
    file_exists: replace
  filename: file
  status:
    plugin: default_value
    default_value: 1
  uid:
    plugin: default_value
    default_value: 1

destination:
  plugin: entity:file

migration_dependencies: {}

dependencies:
  module:
    - eiw_migrate
  enforced:
    module:
      - eiw_migrate
