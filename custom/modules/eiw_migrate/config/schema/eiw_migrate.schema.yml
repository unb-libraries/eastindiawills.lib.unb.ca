eiw_migrate.settings:
  type: config_object
  label: 'East India Wills Migration Settings'
  mapping:
    courts:
      type: sequence
      label: 'Courts'
      sequence:
        type: string
    marital_statuses:
      type: sequence
      label: 'Marital Statuses'
      sequence:
        type: string
    source_types:
      type: sequence
      label: 'Source Types'
      sequence:
        type: string
    roles:
      type: sequence
      label: 'Roles'
      sequence:
        type: string
    ships:
      type: sequence
      label: 'Ships'
      sequence:
        type: string
    voyages:
      type: sequence
      label: 'Voyages'
      sequence:
        type: string
    voyage_years:
      type: mapping
      label: 'Departure years of the voyages to import (inclusive)'
      mapping:
        from:
          type: integer
          label: 'From'
        to:
          type: integer
          label: 'To'
