services:
  eiw_migrate.0_item_migrate_subscriber:
    class: Drupal\eiw_migrate\Event\ItemMigrateEvent
    arguments: ['@entity_type.manager']
    tags:
      - { name: event_subscriber }
  eiw_migrate.voyage_stop_cleanup:
    class: Drupal\eiw_migrate\Event\VoyageStopCleanup
    arguments: ['@entity_type.manager']
    tags:
      - { name: event_subscriber }
  eiw_migrate.voyage_year_filter:
    class: Drupal\eiw_migrate\Event\VoyageYearFilter
    arguments: ['@config.factory']
    tags:
      - { name: event_subscriber }
